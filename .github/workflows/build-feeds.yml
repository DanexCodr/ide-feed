name: Build feeds

on:
  push:
    paths:
      - 'sources/**'
      - 'tools/**'
      - '.github/workflows/build-feeds.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install readability-lxml beautifulsoup4 html2text trafilatura openai

      - name: Generate feeds
        run: python3 tools/build-feeds.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DAILY_DEV_TOKEN: ${{ secrets.DAILY_DEV_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "droidbuild-feed-bot"
          git config user.email "droidbuild-feed-bot@users.noreply.github.com"
          git add feeds/
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "regenerate feeds"
            git push
          fi
