name: Build feeds

on:
  push:
    paths:
      - 'sources/**'
      - 'tools/**'
      - '.github/workflows/build-feeds.yml'
  schedule:
    # Every six hours, on the hour.
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Serialize runs of this workflow. If a run is already in
# progress, the new one waits its turn instead of racing.
concurrency:
  group: build-feeds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the rebase below has something to
          # replay onto. A shallow clone (fetch-depth: 1) can make
          # `git pull --rebase` fail with "shallow update not
          # allowed" when the remote tip has moved.
          fetch-depth: 0
          # Persist the token so the final `git push` uses the
          # same credentials. This is the default, but being
          # explicit avoids surprises if the action's defaults
          # change.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install readability-lxml beautifulsoup4 html2text trafilatura Pillow

      - name: Generate feeds
        run: python3 tools/build-feeds.py
        env:
          DAILY_DEV_TOKEN: ${{ secrets.DAILY_DEV_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "droidbuild-feed-bot"
          git config user.email "droidbuild-feed-bot@users.noreply.github.com"
          git add feeds/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "regenerate feeds"

          # The remote may have received new commits between our
          # checkout and this push. Replay our commit on top of
          # whatever is there now, then push. The autostash flag
          # makes rebase safe even if something left a dirty
          # working tree behind.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
